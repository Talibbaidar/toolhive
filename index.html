<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Toolbox · Image to PDF & more</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- jsPDF, html2canvas, pdf-lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
    body {
      background: #f0f5fa;
      min-height: 100vh;
      display: flex;
    }
    /* sidebar */
    .sidebar {
      width: 260px;
      background: #ffffffcc;
      backdrop-filter: blur(8px);
      border-right: 1px solid rgba(0,0,0,0.05);
      padding: 24px 16px;
      height: 100vh;
      overflow-y: auto;
      position: sticky;
      top:0;
      flex-shrink:0;
    }
    .sidebar h2 {
      font-size:1.4rem;
      color:#0b2b3d;
      margin-bottom:24px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .sidebar h2 i { color:#2a7faa; }
    .tool-category {
      margin-bottom:20px;
    }
    .tool-category h4 {
      font-size:0.7rem;
      text-transform:uppercase;
      letter-spacing:0.05em;
      color:#4b6e83;
      margin-bottom:6px;
      opacity:0.7;
    }
    .tool-btn {
      display: flex;
      align-items: center;
      gap:10px;
      width:100%;
      padding:8px 12px;
      border:none;
      background:transparent;
      border-radius:12px;
      color:#1f4357;
      font-weight:500;
      font-size:0.9rem;
      cursor:pointer;
      transition:0.15s;
      margin-bottom:2px;
    }
    .tool-btn i { width:20px; color:#3b7a9a; }
    .tool-btn:hover { background:#e6f0f7; }
    .tool-btn.active {
      background:#2a7faa;
      color:white;
    }
    .tool-btn.active i { color:white; }

    /* main */
    .main-content {
      flex:1;
      padding:30px 40px;
      max-height:100vh;
      overflow-y:auto;
    }
    .tool-panel {
      display:none;
      animation:fade 0.2s ease;
    }
    .tool-panel.active-panel { display:block; }
    @keyframes fade { from{opacity:0.3;} to{opacity:1;} }

    .panel-header {
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:24px;
    }
    .panel-header i { font-size:2rem; color:#2a7faa; }
    .panel-header h1 { font-weight:600; color:#0b2b3d; }

    .card-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
      background:white;
      padding:24px;
      border-radius:28px;
      box-shadow:0 6px 16px rgba(0,0,0,0.02);
      border:1px solid #eaf0f5;
    }
    @media(max-width:700px){ .card-grid{grid-template-columns:1fr;} }

    .input-group { margin-bottom:16px; }
    .input-group label { display:block; font-weight:500; color:#1b4054; margin-bottom:4px; font-size:0.9rem; }
    .input-group input, .input-group select {
      width:100%;
      padding:10px 14px;
      border:1px solid #d5e2ec;
      border-radius:14px;
      font-size:0.95rem;
      background:#f9fcff;
    }
    .input-group input:focus { outline:2px solid #2a7faa55; border-color:#2a7faa; }

    .btn {
      padding:10px 24px;
      border:none;
      border-radius:40px;
      font-weight:500;
      background:#eef4f9;
      color:#1f4357;
      cursor:pointer;
      transition:0.15s;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .btn-primary { background:#1f5f7e; color:white; box-shadow:0 4px 12px rgba(31,95,126,0.2); }
    .btn-primary:hover { background:#154b64; }
    .btn-secondary { background:#e5eef6; }
    .btn-secondary:hover { background:#d2e2ef; }
    .btn-sm { padding:6px 16px; font-size:0.85rem; }

    .result-box {
      background:#f0f7fc;
      padding:14px 18px;
      border-radius:16px;
      margin-top:12px;
      border-left:4px solid #2a7faa;
    }

    .file-drop {
      border:2px dashed #b6d2e3;
      border-radius:20px;
      padding:24px;
      text-align:center;
      background:#f9fcff;
      cursor:pointer;
      transition:0.2s;
    }
    .file-drop:hover { border-color:#2a7faa; background:#f0f8fe; }

    .preview-thumbs {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }
    .preview-thumbs img {
      width:70px;
      height:70px;
      object-fit:cover;
      border-radius:12px;
      border:2px solid white;
      box-shadow:0 2px 6px rgba(0,0,0,0.06);
    }

    .badge { background:#d4e3ef; border-radius:40px; padding:2px 12px; font-size:0.7rem; color:#1a4054; }

    .flex-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .mt-12 { margin-top:12px; }
    .mb-12 { margin-bottom:12px; }
    .gap-8 { gap:8px; }

    /* scroll */
    ::-webkit-scrollbar { width:5px; }
    ::-webkit-scrollbar-track { background:#eaf0f5; }
    ::-webkit-scrollbar-thumb { background:#b0ccde; border-radius:20px; }
  </style>
</head>
<body>
  <!-- SIDEBAR -->
  <nav class="sidebar" id="sidebar">
    <h2><i class="fas fa-cubes"></i> Toolbox</h2>
    <div class="tool-category">
      <h4>📄 PDF Tools</h4>
      <button class="tool-btn active" data-tool="image2pdf"><i class="fas fa-file-image"></i> Image to PDF</button>
      <button class="tool-btn" data-tool="mergepdf"><i class="fas fa-object-group"></i> Merge PDF</button>
      <button class="tool-btn" data-tool="splitpdf"><i class="fas fa-cut"></i> Split PDF</button>
      <button class="tool-btn" data-tool="pdftoword"><i class="fas fa-file-word"></i> PDF to Word</button>
    </div>
    <div class="tool-category">
      <h4>🖼️ Image Tools</h4>
      <button class="tool-btn" data-tool="compressimg"><i class="fas fa-compress-alt"></i> Compress</button>
      <button class="tool-btn" data-tool="resizeimg"><i class="fas fa-expand-arrows-alt"></i> Resize</button>
      <button class="tool-btn" data-tool="convertimg"><i class="fas fa-exchange-alt"></i> Convert Format</button>
    </div>
    <div class="tool-category">
      <h4>🤖 AI Tools</h4>
      <button class="tool-btn" data-tool="resume"><i class="fas fa-file-alt"></i> Resume Builder</button>
      <button class="tool-btn" data-tool="coverletter"><i class="fas fa-envelope-open-text"></i> Cover Letter</button>
      <button class="tool-btn" data-tool="emailwriter"><i class="fas fa-mail-bulk"></i> Email Writer</button>
      <button class="tool-btn" data-tool="grammar"><i class="fas fa-spell-check"></i> Grammar Check</button>
      <button class="tool-btn" data-tool="promptgen"><i class="fas fa-magic"></i> Prompt Generator</button>
    </div>
    <div class="tool-category">
      <h4>🧮 Calculators</h4>
      <button class="tool-btn" data-tool="agecalc"><i class="fas fa-calendar-alt"></i> Age Calculator</button>
      <button class="tool-btn" data-tool="emicalc"><i class="fas fa-hand-holding-usd"></i> EMI Calculator</button>
      <button class="tool-btn" data-tool="gstcalc"><i class="fas fa-percent"></i> GST Calculator</button>
      <button class="tool-btn" data-tool="bmi"><i class="fas fa-weight"></i> BMI Calculator</button>
      <button class="tool-btn" data-tool="percentcalc"><i class="fas fa-percent"></i> Percentage</button>
    </div>
    <div class="tool-category">
      <h4>📱 Social Media</h4>
      <button class="tool-btn" data-tool="ytitle"><i class="fab fa-youtube"></i> YouTube Title</button>
      <button class="tool-btn" data-tool="hashtag"><i class="fas fa-hashtag"></i> Hashtag Generator</button>
      <button class="tool-btn" data-tool="bio"><i class="fas fa-user-tag"></i> Bio Generator</button>
      <button class="tool-btn" data-tool="caption"><i class="fas fa-quote-right"></i> Caption Generator</button>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <div class="main-content" id="mainContent">
    <!-- All panels will be injected here by JS, or we define them inline -->
    <div id="panelContainer"></div>
  </div>

  <script>
    // ----- tool definitions -----
    const toolDefs = {
      image2pdf: { icon: 'fa-file-image', label: 'Image to PDF', render: renderImageToPdf },
      mergepdf: { icon: 'fa-object-group', label: 'Merge PDF', render: renderMergePdf },
      splitpdf: { icon: 'fa-cut', label: 'Split PDF', render: renderSplitPdf },
      pdftoword: { icon: 'fa-file-word', label: 'PDF to Word', render: renderPdfToWord },
      compressimg: { icon: 'fa-compress-alt', label: 'Compress Image', render: renderCompressImage },
      resizeimg: { icon: 'fa-expand-arrows-alt', label: 'Resize Image', render: renderResizeImage },
      convertimg: { icon: 'fa-exchange-alt', label: 'Convert Image Format', render: renderConvertImage },
      resume: { icon: 'fa-file-alt', label: 'Resume Builder', render: renderResume },
      coverletter: { icon: 'fa-envelope-open-text', label: 'Cover Letter Generator', render: renderCoverLetter },
      emailwriter: { icon: 'fa-mail-bulk', label: 'Email Writer', render: renderEmailWriter },
      grammar: { icon: 'fa-spell-check', label: 'Grammar Checker', render: renderGrammarCheck },
      promptgen: { icon: 'fa-magic', label: 'Prompt Generator', render: renderPromptGen },
      agecalc: { icon: 'fa-calendar-alt', label: 'Age Calculator', render: renderAgeCalc },
      emicalc: { icon: 'fa-hand-holding-usd', label: 'EMI Calculator', render: renderEmiCalc },
      gstcalc: { icon: 'fa-percent', label: 'GST Calculator', render: renderGstCalc },
      bmi: { icon: 'fa-weight', label: 'BMI Calculator', render: renderBmi },
      percentcalc: { icon: 'fa-percent', label: 'Percentage Calculator', render: renderPercentCalc },
      ytitle: { icon: 'fab fa-youtube', label: 'YouTube Title Generator', render: renderYtTitle },
      hashtag: { icon: 'fa-hashtag', label: 'Hashtag Generator', render: renderHashtag },
      bio: { icon: 'fa-user-tag', label: 'Bio Generator', render: renderBio },
      caption: { icon: 'fa-quote-right', label: 'Caption Generator', render: renderCaption }
    };

    let currentTool = 'image2pdf';
    const container = document.getElementById('panelContainer');

    // navigation
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const tool = this.dataset.tool;
        currentTool = tool;
        renderPanel(tool);
      });
    });

    function renderPanel(toolId) {
      const def = toolDefs[toolId];
      if (!def) return;
      container.innerHTML = `<div class="tool-panel active-panel">
        <div class="panel-header"><i class="fas ${def.icon}"></i><h1>${def.label}</h1></div>
        <div class="card-grid" id="panelContent"></div>
      </div>`;
      def.render(document.getElementById('panelContent'));
    }

    // ----- tool render functions -----

    // 1. Image to PDF (original with border/spread)
    function renderImageToPDFCore(containerEl) {
      // we'll reuse the existing logic but adapt to container
      containerEl.innerHTML = `
        <div class="upload-area" style="grid-column:1/2;">
          <div class="file-drop" id="dropZoneImgPdf">
            <i class="fas fa-cloud-upload-alt" style="font-size:2rem;color:#3b8bb0;"></i>
            <p>Drop images or click</p>
            <small>JPG, PNG, WebP</small>
            <input type="file" id="fileInputImgPdf" accept="image/*" multiple style="display:none;">
          </div>
          <div class="preview-thumbs" id="previewGridImgPdf"><span class="badge">No images</span></div>
          <div class="flex-row mt-12">
            <button class="btn btn-secondary btn-sm" id="clearAllImgPdf"><i class="fas fa-trash"></i> Clear</button>
            <button class="btn btn-secondary btn-sm" id="sortImgPdf"><i class="fas fa-sort-alpha-down"></i> Sort</button>
          </div>
        </div>
        <div style="grid-column:2/3;">
          <div class="input-group"><label><i class="fas fa-border-all"></i> Border color</label><input type="color" id="borderColorImgPdf" value="#2a5f7a"></div>
          <div class="input-group"><label>Border width: <span id="borderWidthLabelImgPdf">3</span> pt</label><input type="range" id="borderWidthImgPdf" min="0" max="12" value="3" step="0.5"></div>
          <div class="input-group"><label>Padding: <span id="paddingLabelImgPdf">8</span> px</label><input type="range" id="pagePaddingImgPdf" min="0" max="30" value="8" step="1"></div>
          <div class="input-group"><label>Spread</label>
            <div class="flex-row" id="spreadGroupImgPdf">
              <button class="btn btn-sm active" data-spread="single">Single</button>
              <button class="btn btn-sm" data-spread="double">Double</button>
              <button class="btn btn-sm" data-spread="triptych">Triplet</button>
            </div>
          </div>
          <button class="btn btn-primary" id="generatePdfImgPdf"><i class="fas fa-file-pdf"></i> Generate PDF</button>
          <div id="statusImgPdf" class="result-box" style="margin-top:12px;"><i class="fas fa-info-circle"></i> Ready</div>
        </div>
      `;
      // attach events
      const fileInput = document.getElementById('fileInputImgPdf');
      const dropZone = document.getElementById('dropZoneImgPdf');
      const previewGrid = document.getElementById('previewGridImgPdf');
      const clearBtn = document.getElementById('clearAllImgPdf');
      const sortBtn = document.getElementById('sortImgPdf');
      const generateBtn = document.getElementById('generatePdfImgPdf');
      const statusDiv = document.getElementById('statusImgPdf');

      let imageFiles = [], imageUrls = [];
      const borderColor = document.getElementById('borderColorImgPdf');
      const borderWidth = document.getElementById('borderWidthImgPdf');
      const borderLabel = document.getElementById('borderWidthLabelImgPdf');
      const paddingSlider = document.getElementById('pagePaddingImgPdf');
      const paddingLabel = document.getElementById('paddingLabelImgPdf');
      const spreadBtns = document.querySelectorAll('#spreadGroupImgPdf .btn');
      let currentSpread = 'single';

      function updatePreviews() {
        previewGrid.innerHTML = '';
        if (imageUrls.length === 0) { previewGrid.innerHTML = '<span class="badge">No images</span>'; return; }
        imageUrls.forEach((url, i) => {
          const img = document.createElement('img');
          img.src = url;
          img.style.position = 'relative';
          const wrap = document.createElement('div');
          wrap.style.position = 'relative';
          const rm = document.createElement('button');
          rm.innerHTML = '<i class="fas fa-times"></i>';
          rm.style.position = 'absolute'; rm.style.top = '2px'; rm.style.right = '2px';
          rm.style.background = 'rgba(0,0,0,0.6)'; rm.style.border = 'none'; rm.style.color = 'white';
          rm.style.borderRadius = '20px'; rm.style.width = '18px'; rm.style.height = '18px'; rm.style.fontSize = '10px';
          rm.style.cursor = 'pointer';
          rm.addEventListener('click', (e) => { e.stopPropagation(); removeImage(i); });
          wrap.appendChild(img);
          wrap.appendChild(rm);
          previewGrid.appendChild(wrap);
        });
      }
      function removeImage(index) {
        if (index >= 0 && index < imageUrls.length) {
          URL.revokeObjectURL(imageUrls[index]);
          imageUrls.splice(index,1); imageFiles.splice(index,1);
          updatePreviews();
          setStatus(`${imageUrls.length} images`);
        }
      }
      function addFiles(files) {
        for (let f of files) {
          if (f.type.startsWith('image/')) {
            imageFiles.push(f);
            imageUrls.push(URL.createObjectURL(f));
          }
        }
        updatePreviews();
        setStatus(`${imageUrls.length} images`);
      }
      function clearAll() {
        imageUrls.forEach(u => URL.revokeObjectURL(u));
        imageFiles = []; imageUrls = [];
        updatePreviews();
        setStatus('Cleared');
      }
      function sortImages() {
        if (imageFiles.length < 2) return;
        const combined = imageFiles.map((f,i) => ({file:f, url:imageUrls[i]}));
        combined.sort((a,b) => a.file.name.localeCompare(b.file.name));
        imageFiles = combined.map(c => c.file);
        imageUrls = combined.map(c => c.url);
        updatePreviews();
        setStatus('Sorted');
      }
      function setStatus(msg, err=false) {
        statusDiv.innerHTML = `<i class="fas ${err?'fa-exclamation-triangle':'fa-info-circle'}"></i> ${msg}`;
        statusDiv.style.borderLeftColor = err ? '#b33' : '#2a7faa';
      }

      dropZone.addEventListener('click', ()=>fileInput.click());
      dropZone.addEventListener('dragover', e=>{e.preventDefault(); dropZone.style.borderColor='#1f5f7e';});
      dropZone.addEventListener('dragleave', ()=>dropZone.style.borderColor='#b6d2e3');
      dropZone.addEventListener('drop', e=>{e.preventDefault(); dropZone.style.borderColor='#b6d2e3'; if(e.dataTransfer.files) addFiles(e.dataTransfer.files);});
      fileInput.addEventListener('change', e=>{ if(e.target.files) addFiles(e.target.files); fileInput.value='';});
      clearBtn.addEventListener('click', clearAll);
      sortBtn.addEventListener('click', sortImages);
      borderWidth.addEventListener('input', ()=>borderLabel.textContent = borderWidth.value);
      paddingSlider.addEventListener('input', ()=>paddingLabel.textContent = paddingSlider.value);
      spreadBtns.forEach(b=>b.addEventListener('click', function(){ spreadBtns.forEach(bb=>bb.classList.remove('active')); this.classList.add('active'); currentSpread = this.dataset.spread; }));

      generateBtn.addEventListener('click', async function() {
        if (imageUrls.length === 0) { setStatus('No images!', true); return; }
        const bc = borderColor.value, bw = parseFloat(borderWidth.value) || 0, pad = parseInt(paddingSlider.value) || 0;
        const perPage = currentSpread === 'single' ? 1 : currentSpread === 'double' ? 2 : 3;
        const container = document.createElement('div');
        container.style.cssText = 'position:fixed;left:-9999px;top:0;width:600px;background:white;padding:20px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;border:'+bw+'px solid '+bc+';border-radius:6px;';
        document.body.appendChild(container);
        const pageCanvases = [];
        for (let i = 0; i < imageUrls.length; i += perPage) {
          const chunk = imageUrls.slice(i, i+perPage);
          container.innerHTML = '';
          for (let url of chunk) {
            const img = document.createElement('img');
            img.src = url; img.style.maxWidth='100%'; img.style.maxHeight='100%'; img.style.objectFit='contain';
            img.style.padding = pad+'px'; img.style.borderRadius='4px';
            if (perPage===1) img.style.width='90%'; else if(perPage===2) img.style.width='45%'; else img.style.width='30%';
            container.appendChild(img);
          }
          const imgs = container.querySelectorAll('img');
          await Promise.all(Array.from(imgs).map(img => {
            if (img.complete) return Promise.resolve();
            return new Promise(resolve => { img.onload = resolve; img.onerror = resolve; });
          }));
          try {
            const canvas = await html2canvas(container, { scale:1.8, useCORS:true, backgroundColor:'#ffffff', logging:false });
            pageCanvases.push(canvas);
          } catch(e){ setStatus('Render error', true); document.body.removeChild(container); return; }
        }
        document.body.removeChild(container);
        if (pageCanvases.length === 0) { setStatus('No pages', true); return; }
        const { jsPDF
